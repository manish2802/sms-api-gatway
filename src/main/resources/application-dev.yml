server:
  port: 8000
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/stock-relame

  cloud:
    gateway:
      routes:

        # ==========================
        # Stock Service
        # ==========================
        - id: stock-service
          uri: lb://SMS-STOCK-SERVICE
          predicates:
            - Path=/stocks/**

        - id: stock-api-docs
          uri: lb://SMS-STOCK-SERVICE
          predicates:
            - Path=/v3/api-docs/stocks
          filters:
            - RewritePath=/v3/api-docs/stocks,/v3/api-docs

        # ==========================
        # Order Service
        # ==========================
        - id: order-service
          uri: lb://SMS-ORDER-SERVICE
          predicates:
            - Path=/api/orders/**

        - id: order-api-docs
          uri: lb://SMS-ORDER-SERVICE
          predicates:
            - Path=/v3/api-docs/orders
          filters:
            - RewritePath=/v3/api-docs/orders,/v3/api-docs

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/\*\*]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://sms-registry-server:8761/eureka
    enabled: false  

springdoc:
  swagger-ui:
    disable-swagger-default-url: true
    path: /swagger-ui.html
    urls:
      - name: Stock Service
        url: /v3/api-docs/stocks
      - name: Order Service
        url: /v3/api-docs/orders